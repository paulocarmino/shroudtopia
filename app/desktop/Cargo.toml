[workspace]
resolver = "2"
members = [
    "crates/shroudtopia-core",
    "crates/shroudtopia-win",
]
# The Tauri crate has its own build cycle (cargo-xwin) and Windows-only dependencies; it stays out of this workspace
# so they never enter `cargo test` on Linux (as OrangeMacros does).
exclude = [
    "src-tauri",
]

[workspace.package]
version = "0.1.9"
edition = "2021"
license = "MIT"
publish = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
