[package]
name = "shroudtopia-win"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Shroudtopia Windows glue: registry (Steam path, Run key), process watch, known folders, the Steam remote storage helper."

[dependencies]
shroudtopia-core = { path = "../shroudtopia-core" }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = "3"
