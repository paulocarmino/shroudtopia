[package]
name = "shroudtopia"
version = "0.1.2"
description = "Shroudtopia: the desktop app's window and tray. Wiring only; the app is shroudtopia-core."
edition = "2021"
license = "MIT"
publish = false

# Out of the Cargo workspace of app/desktop (see its Cargo.toml): this crate has its own lock file and its own build
# (cargo-xwin in Docker).
[workspace]

[lib]
# The `_lib` suffix keeps the library's name apart from the binary's (cargo issue 8519, Windows only).
name = "shroudtopia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
shroudtopia-core = { path = "../crates/shroudtopia-core" }
shroudtopia-win = { path = "../crates/shroudtopia-win" }

[target."cfg(windows)".dependencies]
# lib.rs, after an update: waits for the single instance's mutex of the app it replaces to be gone
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
