<title>Shroudtopia Redesign V2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a switch bar on top, the app window (~720px, like OrangeMacros) rendered below it.
   Tokens are OrangeMacros' own (app/tauri/src/app.css), dark only by choice. */
:root {
  --bg: oklch(0.17 0.006 60);
  --surface: oklch(0.21 0.008 60);
  --surface-2: oklch(0.25 0.01 60);
  --border: oklch(0.31 0.011 60);
  --ink: oklch(0.95 0.004 60);
  --muted: oklch(0.72 0.01 60);
  --faint: oklch(0.55 0.01 60);
  --brand: oklch(0.7 0.19 45);
  --brand-hover: oklch(0.75 0.19 45);
  --brand-ink: oklch(0.2 0.05 45);
  --brand-soft: oklch(0.7 0.19 45 / 0.14);
  --brand-ring: oklch(0.7 0.19 45 / 0.4);
  --danger: oklch(0.64 0.2 25);
  --danger-soft: oklch(0.64 0.2 25 / 0.14);
  --ok: oklch(0.74 0.12 150);
  --ok-soft: oklch(0.74 0.12 150 / 0.14);
  --warn: oklch(0.8 0.14 85);
  --warn-soft: oklch(0.8 0.14 85 / 0.14);
  --friend: oklch(0.72 0.11 240);
  --friend-soft: oklch(0.72 0.11 240 / 0.14);
  --page: oklch(0.13 0.005 60);
  --radius: 10px;
  --radius-sm: 7px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--page); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand-ring); outline-offset: 2px; }
.page {
  max-width: 1080px; margin: 0 auto;
  padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 20px;
}
.proto-head h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.proto-head p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }

/* ---------- switch bar ---------- */
.switches { display: grid; gap: 10px; padding: 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); }
.sw { display: grid; grid-template-columns: 120px 1fr; gap: 10px; align-items: center; }
.sw-label { font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: 0.02em; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.seg button {
  border: 1px solid var(--border); background: transparent; border-radius: 999px;
  padding: 3px 11px; font-size: 12.5px; color: var(--muted);
  transition: background .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease);
}
.seg button:hover { color: var(--ink); background: var(--surface); }
.seg button[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--ink); }
.sw[hidden] { display: none; }
@media (max-width: 600px) { .sw { grid-template-columns: 1fr; gap: 4px; } }

/* ---------- app window ---------- */
.stage { display: flex; justify-content: center; overflow-x: auto; }
.win {
  width: 720px; max-width: 100%; height: 580px; flex: none;
  background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
  box-shadow: 0 30px 80px -20px oklch(0 0 0 / 0.7);
  display: flex; flex-direction: column; overflow: hidden; position: relative;
}
.titlebar { height: 30px; flex: none; display: flex; justify-content: flex-end; align-items: center; gap: 2px; padding-right: 4px; }
.titlebar span { width: 34px; height: 22px; display: grid; place-items: center; color: var(--faint); }
.titlebar svg { width: 12px; height: 12px; }

.app-head { display: flex; align-items: center; gap: 12px; padding: 0 20px 14px; border-bottom: 1px solid var(--border); flex: none; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 16px; }
.brand .logo { width: 20px; height: 20px; border-radius: 6px; background: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.brand b { font-weight: 600; }
.brand .light { color: var(--muted); font-weight: 400; }
.spacer { flex: 1; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 12px;
  border: 1px solid var(--border); border-radius: 999px; font-size: 12.5px; color: var(--muted); white-space: nowrap;
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.live { background: var(--brand); animation: pulse 1.8s var(--ease) infinite; }
.dot.ok { background: var(--ok); }
.dot.friend { background: var(--friend); }
.dot.warn { background: var(--warn); }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 var(--brand-ring); } 50% { box-shadow: 0 0 0 4px transparent; } }
.icon-btn { width: 30px; height: 30px; border-radius: var(--radius-sm); border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn svg { width: 16px; height: 16px; }

.app-body { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 20px 20px; display: grid; gap: 22px; align-content: start; }
.sec-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sec-title h2 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
.sec-title .aside { font-size: 12.5px; color: var(--muted); }
.sec { display: grid; gap: 10px; }

/* tabs layout */
.tabs { display: flex; gap: 2px; padding: 0 14px; border-bottom: 1px solid var(--border); flex: none; }
.tab { border: 0; background: transparent; padding: 10px 12px; font-size: 13.5px; color: var(--muted); font-weight: 500; position: relative; display: flex; gap: 7px; align-items: center; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--brand); }
.badge { min-width: 16px; height: 16px; padding: 0 5px; border-radius: 999px; background: var(--brand); color: var(--brand-ink); font-size: 10.5px; font-weight: 700; display: inline-grid; place-items: center; }

/* sidebar layout */
.split { flex: 1; min-height: 0; display: grid; grid-template-columns: 212px 1fr; }
.rail { border-right: 1px solid var(--border); padding: 4px 10px 12px; display: flex; flex-direction: column; gap: 2px; min-height: 0; }
.rail .brand { padding: 0 8px 16px; }
.nav { border: 0; background: transparent; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm); color: var(--muted); font-size: 13.5px; font-weight: 500; text-align: left; }
.nav svg { width: 16px; height: 16px; flex: none; }
.nav:hover { background: var(--surface); color: var(--ink); }
.nav[aria-selected="true"] { background: var(--surface-2); color: var(--ink); }
.nav .badge { margin-left: auto; }
.rail-foot { margin-top: auto; display: grid; gap: 6px; padding: 10px 8px 0; border-top: 1px solid var(--border); }
.rail-foot .k { font-size: 11.5px; color: var(--faint); letter-spacing: 0.04em; text-transform: uppercase; font-weight: 600; }
.person { display: flex; align-items: center; gap: 9px; font-size: 13px; }
.person .muted { color: var(--muted); font-size: 11.5px; line-height: 1.3; }
.person .who { flex: 1; min-width: 0; display: grid; }
.person .nick { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.35; }
.rail-foot { gap: 10px; }
.avatar { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; flex: none; background: var(--surface-2); color: var(--ink); }
.avatar.me { background: var(--brand-soft); color: var(--brand); }
.avatar.friend { background: var(--friend-soft); color: var(--friend); }
.split .app-body { padding-top: 6px; }

/* ---------- shared pieces ---------- */
.card { border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius); }
.row { display: flex; align-items: center; gap: 14px; padding: 14px 16px; }
.row + .row { border-top: 1px solid var(--border); }
.row .txt { flex: 1; min-width: 0; }
.row .name { font-weight: 500; }
.row .sub { color: var(--muted); font-size: 12.5px; }
.btn { height: 34px; padding: 0 16px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: transparent; font-weight: 600; font-size: 13.5px; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; transition: background .15s var(--ease), transform .1s; }
.btn svg { width: 15px; height: 15px; }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { background: var(--brand-hover); }
.btn.friend { background: var(--friend); border-color: var(--friend); color: oklch(0.2 0.04 240); }
.btn.big { height: 42px; padding: 0 22px; font-size: 14.5px; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn.danger-ghost { color: var(--danger); }

.status { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; letter-spacing: 0.01em; }
.status.ok { color: var(--ok); } .status.live { color: var(--brand); } .status.friend { color: var(--friend); }
.status.warn { color: var(--warn); } .status.busy { color: var(--ink); } .status.muted { color: var(--muted); }
.status.ok .dot { background: var(--ok); } .status.friend .dot { background: var(--friend); } .status.warn .dot { background: var(--warn); }
.status.busy .dot { background: var(--ink); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .25; } }

.meta { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.meta b { color: var(--ink); font-weight: 500; }
.bar { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--brand); border-radius: inherit; }
.progress-line { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress-line .bar { grid-column: 1 / -1; }
.note { font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: flex-start; }
.note svg { width: 14px; height: 14px; flex: none; margin-top: 2px; }

/* toggle (OrangeMacros) */
.tg { display: inline-flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 0; }
.tg .track { width: 36px; height: 20px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); position: relative; transition: background .2s var(--ease), border-color .2s; }
.tg .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--muted); transition: transform .2s var(--ease), background .2s; }
.tg[aria-checked="true"] .track { background: var(--brand); border-color: var(--brand); }
.tg[aria-checked="true"] .track::after { transform: translateX(16px); background: var(--brand-ink); }
.tg .lbl { font-size: 11.5px; font-weight: 700; width: 24px; text-align: left; color: var(--faint); }
.tg[aria-checked="true"] .lbl { color: var(--ink); }
.tg.sm .track { width: 30px; height: 17px; } .tg.sm .track::after { width: 11px; height: 11px; }
.tg.sm[aria-checked="true"] .track::after { transform: translateX(13px); }

/* ---------- world variants ---------- */
/* V1 status */
.w1 { padding: 18px; display: grid; gap: 14px; }
.w1-top { display: flex; align-items: flex-start; gap: 16px; }
.w1-top .txt { flex: 1; min-width: 0; display: grid; gap: 4px; }
.w1 h3 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.w1.tone-live { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand-soft); }
.w1.tone-friend { border-color: oklch(0.72 0.11 240 / 0.5); }
.w1.tone-warn { border-color: oklch(0.8 0.14 85 / 0.5); }

/* V2 history */
.w2-head { display: flex; align-items: center; gap: 14px; padding: 16px; }
.w2-head .txt { flex: 1; min-width: 0; display: grid; gap: 2px; }
.w2-head h3 { margin: 0; font-size: 16px; font-weight: 600; }
.hist { border-top: 1px solid var(--border); }
.hist-row { display: grid; grid-template-columns: 24px 1fr auto auto; gap: 12px; align-items: center; padding: 9px 16px; font-size: 13px; font-variant-numeric: tabular-nums; }
.hist-row + .hist-row { border-top: 1px solid var(--border); }
.hist-row .when { color: var(--muted); white-space: nowrap; }
.hist-row .size { color: var(--faint); font-size: 12px; }
.tags { display: flex; gap: 6px; }
.tag { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 5px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.tag.here { background: var(--brand-soft); color: var(--brand); }
.tag.cloud { background: var(--ok-soft); color: var(--ok); }
.tag.live { background: var(--brand); color: var(--brand-ink); }
.tag.friendlive { background: var(--friend); color: oklch(0.2 0.04 240); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.hist-row.current { background: oklch(0.7 0.19 45 / 0.05); }

/* V3 two PCs */
.w3 { padding: 18px; display: grid; gap: 16px; }
.w3-head { display: flex; align-items: center; gap: 12px; }
.w3-head h3 { margin: 0; font-size: 16px; font-weight: 600; flex: 1; }
.lanes { display: grid; grid-template-columns: 1fr 64px 1fr 64px 1fr; align-items: center; }
.node { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; display: grid; gap: 4px; background: var(--bg); min-width: 0; position: relative; }
.node .nt { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; }
.node .nt svg { width: 14px; height: 14px; color: var(--muted); }
.node .nv { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.node.fresh { border-color: var(--ok); }
.node.stale .nv { color: var(--warn); }
.node.hosting { border-color: var(--brand); }
.node.friendhost { border-color: var(--friend); }
.node .lock { position: absolute; top: -9px; right: 10px; font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 5px; }
.node .lock.me { background: var(--brand); color: var(--brand-ink); }
.node .lock.fr { background: var(--friend); color: oklch(0.2 0.04 240); }
.wire { height: 2px; margin: 0 6px; background: var(--border); position: relative; overflow: hidden; border-radius: 2px; }
.wire.flow-r::after, .wire.flow-l::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; background: var(--brand); border-radius: 2px; }
.wire.flow-r::after { animation: flowr 1.1s linear infinite; }
.wire.flow-l::after { animation: flowl 1.1s linear infinite; }
@keyframes flowr { from { left: -40%; } to { left: 100%; } }
@keyframes flowl { from { left: 100%; } to { left: -40%; } }
.w3-foot { display: flex; align-items: center; gap: 14px; }
.w3-foot .note { flex: 1; }
@media (max-width: 640px) { .lanes { grid-template-columns: 1fr; gap: 6px; } .wire { height: 14px; width: 2px; margin: 0 auto; } }

/* V4 compact row */
.w4 .row { padding: 14px 16px; }
.w4 .sub { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

/* diverged choices */
.choices { display: grid; gap: 8px; }
.choice { display: grid; grid-template-columns: 24px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); text-align: left; }
.choice:hover { border-color: var(--muted); }
.choice .t { font-size: 13.5px; font-weight: 500; }
.choice .s { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- mods ---------- */
.mod-row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; }
.mod-row .txt { flex: 1; min-width: 0; }
.mod-row .name { font-weight: 500; }
.mod-row .sub { color: var(--muted); font-size: 12.5px; }
.mod-row.off .name { color: var(--muted); }
.chev { width: 28px; height: 28px; border: 0; background: transparent; border-radius: 6px; color: var(--muted); display: grid; place-items: center; transition: transform .2s var(--ease); }
.chev:hover { background: var(--surface-2); color: var(--ink); }
.chev svg { width: 14px; height: 14px; }
.chev[aria-expanded="true"] { transform: rotate(180deg); }
.mod + .mod { border-top: 1px solid var(--border); }
.opts { padding: 2px 16px 12px 16px; display: grid; gap: 2px; }
.opt { display: flex; align-items: center; gap: 12px; padding: 7px 10px; border-radius: 6px; font-size: 13px; }
.opt:hover { background: var(--surface-2); }
.opt .on { flex: 1; }
.opt .num { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; font-variant-numeric: tabular-nums; }
.opt .num button { width: 26px; height: 26px; border: 0; background: transparent; color: var(--muted); }
.opt .num button:hover { background: var(--surface-2); color: var(--ink); }
.opt .num span { min-width: 48px; text-align: center; font-size: 12.5px; }
.opts.grid2 { grid-template-columns: 1fr 1fr; column-gap: 8px; padding-left: 16px; }
@media (max-width: 640px) { .opts.grid2 { grid-template-columns: 1fr; } }
.mods-flat .modgroup + .modgroup { border-top: 1px solid var(--border); }
.modgroup-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px 6px; }
.modgroup-head .name { flex: 1; font-weight: 600; font-size: 13.5px; }
.modgroup.off .opts { opacity: .45; pointer-events: none; }

/* ---------- update ---------- */
.upd { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
.upd .txt { flex: 1; min-width: 0; display: grid; gap: 6px; }
.upd .name { font-weight: 500; font-size: 13.5px; }
.upd .sub { color: var(--muted); font-size: 12.5px; }
.upd.avail { border-color: var(--brand); background: linear-gradient(var(--brand-soft), var(--brand-soft)), var(--surface); }
.upd-ico { width: 32px; height: 32px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); flex: none; }
.upd-ico svg { width: 16px; height: 16px; }
.upd.avail .upd-ico { background: var(--brand); color: var(--brand-ink); }
.footline { display: flex; align-items: center; gap: 10px; padding: 10px 20px; border-top: 1px solid var(--border); font-size: 12.5px; color: var(--muted); flex: none; }
.footline .link { border: 0; background: transparent; color: var(--brand); font-weight: 600; padding: 0; font-size: 12.5px; }
.changelog { padding: 4px 16px 14px 60px; display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); }
.changelog li { margin: 0; }

/* ---------- first run ---------- */
.fr { flex: 1; min-height: 0; overflow-y: auto; padding: 26px 40px 30px; display: grid; gap: 18px; align-content: start; }
.fr h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.fr .lead { margin: 0; color: var(--muted); max-width: 52ch; }
.pick { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pick .opt-card { text-align: left; border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius); padding: 16px; display: grid; gap: 6px; align-content: start; }
.pick .opt-card:hover { border-color: var(--muted); background: var(--surface-2); }
.pick .opt-card svg { width: 20px; height: 20px; color: var(--brand); }
.pick .opt-card .t { font-weight: 600; }
.pick .opt-card .s { font-size: 12.5px; color: var(--muted); }
@media (max-width: 640px) { .pick { grid-template-columns: 1fr; } .fr { padding: 20px; } }
.slots .row { cursor: pointer; }
.slots .row:hover { background: var(--surface-2); }
.radio { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--border); flex: none; }
.radio.on { border: 5px solid var(--brand); }
.code { display: flex; align-items: center; gap: 12px; padding: 18px; justify-content: space-between; }
.code .val { font-size: 26px; font-weight: 600; letter-spacing: 0.12em; font-variant-numeric: tabular-nums; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
.field { display: flex; align-items: center; gap: 10px; border: 1px solid var(--border); background: var(--bg); border-radius: var(--radius-sm); padding: 0 12px; height: 44px; }
.field:focus-within { border-color: var(--brand); }
.field input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: 600 16px/1 ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: 0.1em; outline: none; }
.steps { display: flex; gap: 6px; }
.steps i { width: 22px; height: 4px; border-radius: 2px; background: var(--surface-2); }
.steps i.on { background: var(--brand); }
.fr-actions { display: flex; gap: 10px; justify-content: flex-end; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- Shroudtopia skin (SHROUDTOPIA_ART_DIRECTION.md §6–§8) ---------- */
.skin-st {
  --bg: #101519; --rail: #13191e; --surface: #1b2329; --surface-2: #232d34; --hover: #2b363e;
  --border: #3b4851; --control-line: #81939d;
  --ink: #f2e9d8; --muted: #b9c4c8; --faint: #96a5ad;

.page.skin-st-page { --page: #0b0f12; }

.skin-st .nav[aria-selected="true"] svg { color: var(--brand); }
.skin-st .badge { border-radius: 4px; }
.skin-st .card { box-shadow: 0 6px 18px rgb(0 0 0 / 14%); }
.skin-st .btn { border-color: var(--control-line); transition: background .14s, color .14s; }
.skin-st .btn:hover { background: var(--hover); }
.skin-st .btn:active { transform: none; }
.skin-st .btn.primary { border-color: var(--brand); }
.skin-st .btn.primary:hover { background: var(--brand-hover); border-color: var(--brand-hover); }
.skin-st .btn.primary:active { background: var(--brand-pressed); }

.skin-st .btn.friend:hover { background: var(--friend-hover); }
.skin-st :focus-visible { outline: 2px solid var(--friend); outline-offset: 3px; }
.skin-st .dot.live { animation: none; }
.skin-st .chip { border-color: var(--border); }
.skin-st .tg .track { border-color: var(--control-line); }
.skin-st .tg .track::after { background: var(--ink); }
.skin-st .tg[aria-checked="true"] .track::after { background: var(--brand-ink); }
.skin-st .tag { border-radius: 4px; }
.skin-st .tag.here { background: var(--surface-2); color: var(--ink); }
.skin-st .tag.cloud { background: var(--friend-soft); color: var(--friend); }
.skin-st .tag.live { background: var(--brand-soft); color: var(--brand); }
.skin-st .tag.friendlive { background: var(--friend-soft); color: var(--friend); }
.skin-st .hist-row.current { background: rgb(255 255 255 / 0.025); }
.skin-st .avatar.me { background: var(--brand-soft); color: var(--brand); }
.skin-st .avatar.friend { background: var(--friend-soft); color: var(--friend); }

.skin-st .modgroup.off .opts { opacity: 1; pointer-events: auto; }

.fr.embedded { padding: 0; overflow: visible; }

/* ---------- kit V2: illustrations (SHROUDTOPIA_ART_DIRECTION.md V2 §3–§6) ---------- */
.skin-st .rail .brand { display: flex; align-items: center; justify-content: center; padding: 6px 0 20px; }

</div>

<script>
const ICON = {
  min: '<svg viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor" stroke-width="1"/></svg>',

  globe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
  puzzle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M10 3h4v3a2 2 0 1 0 4 0V3h3v7h-3a2 2 0 1 0 0 4h3v7h-7v-3a2 2 0 1 0-4 0v3H3v-7h3a2 2 0 1 0 0-4H3V3z"/></svg>',

  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10.2-6.5a1 1 0 0 0 0-1.8L9.5 4.6A1 1 0 0 0 8 5.5z"/></svg>',

  link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>',
  refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.6-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.6 4.5L20 16M20 20v-4h-4"/></svg>',
};

const SWITCHES = [
  { key: 'skin', label: 'Visual', opts: [['st', 'Depois · Shroudtopia'], ['om', 'Antes · OrangeMacros']] },
  { key: 'nick', label: 'Nick', opts: [['raw', 'Como está na Steam'], ['nfkc', 'Letras largas normalizadas']] },
  { key: 'screen', label: 'Tela', opts: [['main', 'Principal'], ['first', 'Primeiro uso']] },
  { key: 'tab', label: 'Aba aberta', opts: [['world', 'Mundo'], ['mods', 'Mods'], ['update', 'Atualização']], when: s => true },
  { key: 'sync', label: 'Estado do sync', opts: [['sync', 'Em dia'], ['me', 'Você hospedando'], ['friend', 'Amigo hospedando'], ['behind', 'Baixando do amigo'], ['up', 'Enviando'], ['diverged', 'Divergiu'], ['offline', 'Sem servidor']], when: s => true },
  { key: 'upd', label: 'Atualização', opts: [['ok', 'Em dia'], ['avail', 'Disponível'], ['blocked', 'Jogo aberto'], ['installing', 'Instalando']], when: s => true },
  { key: 'step', label: 'Passo', opts: [['choose', 'Escolher'], ['slot', 'Qual mundo'], ['code', 'Código criado'], ['paste', 'Colar código']], when: s => s.screen === 'first' },
];

const DEFAULTS = { skin: 'st', title: 'sans', amb: 'flat', nick: 'raw', screen: 'main', layout: 'side', tab: 'world', world: 'status', sync: 'sync', mods: 'expand', upd: 'ok', step: 'choose' };
let S = { ...DEFAULTS };
try { Object.assign(S, JSON.parse(localStorage.getItem('shroud-redesign-v2') || '{}')); } catch (e) {}
S.layout = 'side'; S.world = 'history'; S.mods = 'expand';
const save = () => { try { localStorage.setItem('shroud-redesign-v2', JSON.stringify(S)); } catch (e) {} };

/* ---------- data (world numbers read from this PC on 2026-10-21) ---------- */
const WORLD = { name: 'Mundo do bang', file: 'world0.ksd', size: '1,8 MB' };
// Both names come from each player's Steam nick (Steam/config/loginusers.vdf, PersonaName); ME is the real one on this PC, FR is an example.
const ME_RAW = '[ツ] Ｌ　Ａ　Ｒ　Ａ　Ｎ　Ｊ　Ｏ'; let ME = ME_RAW; const ME_UNUSED = '[ツ] ＬＡＲＡＮＪＯ', FR = 'rodrigao_br';
const MEI = 'L', FRI = FR[0].toUpperCase();

const SYNC = {
  sync:     { tone: 'ok', status: 'Em dia', line: `${FR} jogou por último · ontem, 23:40 · 1h52 de sessão`, action: { label: 'Jogar', icon: 'play', cls: 'primary' }, game: false },
  me:       { tone: 'live', status: 'Você está hospedando', line: 'Desde 21:12 · último autosave enviado às 22:31', action: { label: 'Enshrouded aberto', disabled: true }, game: true },
  friend:   { tone: 'friend', status: `${FR} está hospedando`, line: 'Desde 20:47 · o mundo fica com ele até fechar o jogo', action: { label: 'Entrar pelo Steam', icon: 'join', cls: 'friend' }, game: false, note: 'Abrir o mundo daqui fica travado enquanto ele joga, para ninguém perder progresso.' },
  behind:   { tone: 'busy', status: `Baixando a sessão do ${FR}`, line: `${FR} jogou hoje, 14:10 – 16:02`, progress: [62, '1,1 de 1,8 MB'], action: { label: 'Jogar', icon: 'play', cls: 'primary', disabled: true }, game: false },
  up:       { tone: 'busy', status: 'Enviando sua sessão', line: 'Você jogou hoje, 21:12 – 23:05', progress: [40, '0,7 de 1,8 MB'], action: { label: 'Jogar', icon: 'play', cls: 'primary', disabled: true }, game: false },
  diverged: { tone: 'warn', status: 'Vocês jogaram separados', line: 'Os dois abriram o mundo sem o outro saber. Escolha qual segue.', game: false },
  offline:  { tone: 'muted', status: 'Sem conexão com o servidor', line: 'Dá para jogar normal. Sua sessão sobe quando a conexão voltar.', action: { label: 'Jogar', icon: 'play', cls: 'primary' }, game: false, note: `Se o ${FR} jogar nesse meio-tempo, vocês vão ter que escolher qual versão segue.` },
};

const HIST = {
  sync:     [['fr', `${FR}`, 'ontem, 21:48 – 23:40', '1,8 MB', ['here', 'cloud']], ['me', 'Você', 'ontem, 14:02 – 17:15', '1,7 MB', []], ['fr', `${FR}`, 'dom, 20:30 – 23:58', '1,7 MB', []]],
  me:       [['me', 'Você', 'hoje, desde 21:12', '1,8 MB', ['live']], ['fr', `${FR}`, 'ontem, 21:48 – 23:40', '1,8 MB', ['cloud']], ['me', 'Você', 'ontem, 14:02 – 17:15', '1,7 MB', []]],
  friend:   [['fr', `${FR}`, 'hoje, desde 20:47', '—', ['friendlive']], ['fr', `${FR}`, 'ontem, 21:48 – 23:40', '1,8 MB', ['here', 'cloud']], ['me', 'Você', 'ontem, 14:02 – 17:15', '1,7 MB', []]],
  behind:   [['fr', `${FR}`, 'hoje, 14:10 – 16:02', '1,8 MB', ['cloud']], ['me', 'Você', 'ontem, 21:48 – 23:40', '1,8 MB', ['here']], ['fr', `${FR}`, 'ontem, 14:02 – 17:15', '1,7 MB', []]],
  up:       [['me', 'Você', 'hoje, 21:12 – 23:05', '1,8 MB', ['here']], ['fr', `${FR}`, 'hoje, 14:10 – 16:02', '1,8 MB', ['cloud']], ['me', 'Você', 'ontem, 21:48 – 23:40', '1,8 MB', []]],
  diverged: [['me', 'Você', 'hoje, 19:00 – 20:30', '1,8 MB', ['here', 'warn']], ['fr', `${FR}`, 'hoje, 18:40 – 20:10', '1,8 MB', ['cloud', 'warn']], ['me', 'Você', 'ontem, 21:48 – 23:40', '1,8 MB', []]],
  offline:  [['me', 'Você', 'ontem, 21:48 – 23:40', '1,8 MB', ['here']], ['fr', `${FR}`, 'ontem, 14:02 – 17:15', '1,7 MB', []]],
};
const TAGTXT = { here: 'neste PC', cloud: 'no servidor', live: 'jogando agora', friendlive: 'jogando agora', warn: 'versão separada' };

const MODS = [
  { id: 'basics', name: 'Básicos', sub: 'Stamina, queda e custo de recursos', on: true, opts: [
    ['Sem gasto de stamina', true], ['Sem dano de queda', true], ['Construir e usar itens sem gastar', false], ['Esconder a barra de stamina', true]] },
  { id: 'flight', name: 'Voo', sub: 'Planar sem perder altura', on: true, opts: [] },
  { id: 'fpv', name: 'Primeira pessoa', sub: 'Câmera nos olhos do personagem', on: false, opts: [['Distância da câmera', -0.15, 'num']] },
];
let openMod = 'basics';

/* ---------- pieces ---------- */
const st = (tone, txt) => `<span class="status ${tone}"><span class="dot${tone === 'live' ? ' live' : ''}"></span>${txt}</span>`;
const btn = a => a ? `<button class="btn ${a.cls || ''} big" ${a.disabled ? 'disabled' : ''}>${a.icon ? ICON[a.icon] : ''}${a.label}</button>` : '';
const btnSm = a => a ? `<button class="btn ${a.cls || ''}" ${a.disabled ? 'disabled' : ''}>${a.icon ? ICON[a.icon] : ''}${a.label}</button>` : '';
const prog = p => p ? `<div class="progress-line"><span>${p[1]}</span><span>${p[0]}%</span><div class="bar"><i style="width:${p[0]}%"></i></div></div>` : '';
const note = (txt, icon = 'info') => txt ? `<div class="note">${ICON[icon]}<span>${txt}</span></div>` : '';

function choices() {
  return `<div class="choices">
    <button class="choice"><span class="avatar me">${MEI}</span><span><div class="t">Seguir com a sua</div><div class="s">hoje, 19:00 – 20:30 · neste PC</div></span>${ICON.chev.replace('<svg', '<svg style="width:14px;transform:rotate(-90deg);color:var(--muted)"')}</button>

  </div>${note('A que ficar de fora não é apagada: vai para o histórico do mundo.')}`;
}

function worldStatus() {
  const d = SYNC[S.sync];
  return `<div class="card w1 tone-${d.tone}">

      <div class="txt">${st(d.tone, d.status)}<h3>${WORLD.name}</h3><div class="meta"><span>${d.line}</span></div></div>

    ${prog(d.progress)}
    ${S.sync === 'diverged' ? choices() : note(d.note, S.sync === 'offline' ? 'alert' : 'info')}

  </div>`;
}

function worldHistory() {
  const d = SYNC[S.sync];
  const rows = HIST[S.sync].map((r, i) => `<div class="hist-row${i === 0 ? ' current' : ''}">
    <span class="avatar ${r[0] === 'me' ? 'me' : 'friend'}">${r[0] === 'me' ? MEI : FRI}</span>
    <span><b style="font-weight:500">${r[1]}</b> <span class="when">· ${r[2]}</span></span>
    <span class="tags">${r[4].map(t => `<span class="tag ${t}">${TAGTXT[t]}</span>`).join('')}</span>

function worldPcs() {
  const d = SYNC[S.sync];
  const n = {
    sync:     [['fresh', 'ontem 23:40'], ['fresh', 'ontem 23:40'], ['fresh', 'ontem 23:40'], '', ''],
    me:       [['hosting', 'jogando agora', 'me'], ['', 'autosave 22:31'], ['', 'ontem 23:40'], 'flow-r', ''],
    friend:   [['', 'ontem 23:40'], ['', 'ontem 23:40'], ['friendhost', 'jogando agora', 'fr'], '', ''],
    behind:   [['stale', 'ontem 23:40'], ['fresh', 'hoje 16:02'], ['fresh', 'hoje 16:02'], 'flow-l', ''],
    up:       [['fresh', 'hoje 23:05'], ['stale', 'hoje 16:02'], ['', 'hoje 16:02'], 'flow-r', ''],
    diverged: [['stale', 'hoje 20:30 · separada'], ['', 'hoje 20:10'], ['stale', 'hoje 20:10 · separada'], '', ''],
    offline:  [['', 'ontem 23:40'], ['', 'sem conexão'], ['', '?'], '', ''],
  }[S.sync];
  const node = (x, icon, title) => `<div class="node ${x[0]}">${x[2] ? `<span class="lock ${x[2]}">HOSPEDANDO</span>` : ''}<div class="nt">${ICON[icon]}${title}</div><div class="nv">${x[1]}</div></div>`;
  const foot = S.sync === 'diverged' ? choices() : `<div class="w3-foot">${d.progress ? `<div style="flex:1">${prog(d.progress)}</div>` : `<div class="note" style="flex:1">${d.note ? ICON.info + `<span>${d.note}</span>` : `<span>${d.line}</span>`}</div>`}${btn(d.action)}</div>`;
  return `<div class="card w3">
    <div class="w3-head"><h3>${WORLD.name}</h3>${st(d.tone, d.status)}</div>
    <div class="lanes">${node(n[0], 'pc', 'Seu PC')}<div class="wire ${n[3]}"></div>${node(n[1], 'cloud', 'Servidor')}<div class="wire ${n[4]}"></div>${node(n[2], 'pc', `PC do ${FR}`)}</div>
    ${foot}
  </div>`;
}

function modsExpand() {
  return `<div class="card">${MODS.map(m => {
    const open = openMod === m.id && m.opts.length;
    return `<div class="mod">
      <div class="mod-row${m.on ? '' : ' off'}">
        <div class="txt"><div class="name">${m.name}</div><div class="sub">${m.sub}${m.opts.length ? ` · ${m.opts.length} ${m.opts.length > 1 ? 'opções' : 'opção'}` : ''}</div></div>
        ${m.opts.length ? `<button class="chev" data-mod="${m.id}" aria-expanded="${!!open}">${ICON.chev}</button>` : ''}
        ${tg(m.on)}
      </div>
      ${open ? `<div class="opts">${m.opts.map(optRow).join('')}</div>` : ''}
    </div>`;
  }).join('')}</div>`;
}
function optRow(o) {
  if (o[2] === 'num') return `<div class="opt"><span class="on">${o[0]}</span><span class="num"><button>−</button><span>${o[1].toFixed(2).replace('.', ',')}</span><button>+</button></span></div>`;
  return `<div class="opt"><span class="on">${o[0]}</span>${tg(o[1], true)}</div>`;
}
function modsFlat() {
  return `<div class="card mods-flat">${MODS.map(m => `<div class="modgroup${m.on ? '' : ' off'}">
    <div class="modgroup-head"><span class="name">${m.name}</span>${tg(m.on)}</div>
    ${m.opts.length ? `<div class="opts grid2">${m.opts.map(optRow).join('')}</div>` : `<div class="opts"><div class="opt" style="color:var(--muted)">${m.sub}</div></div>`}
  </div>`).join('')}</div>`;
}
const MODS_V = { expand: modsExpand, flat: modsFlat };

function updCard(full) {

    avail:      { cls: 'avail', icon: 'download', name: 'Versão 0.4.3 disponível', sub: 'Você está na 0.4.2 · 3,4 MB', act: { label: 'Atualizar', cls: 'primary' } },
    blocked:    { cls: 'avail', icon: 'download', name: 'Versão 0.4.3 pronta', sub: 'Feche o Enshrouded para instalar. Instala sozinho quando fechar.', act: { label: 'Atualizar', cls: 'primary', disabled: true } },
    installing: { cls: '', icon: 'download', name: 'Instalando 0.4.3', sub: '', prog: [70, 'Copiando os mods para a pasta do jogo'] },
  }[S.upd];
  const changes = full && S.upd !== 'ok' ? `<ul class="changelog"><li>Voo: volta a funcionar depois do pulo em água</li><li>Básicos: opção de esconder a barra de stamina</li><li>App: aviso quando seu amigo começa a hospedar</li></ul>` : '';

  </div>${changes}</div>`;
}

function layoutSingle() {
  const updLine = S.upd === 'ok'
    ? `<div class="footline">${ICON.refresh.replace('<svg', '<svg style="width:13px"')}<span>Mods v0.4.2 · tudo atualizado</span><span class="spacer"></span><button class="link">Verificar</button></div>`
    : '';
  return `${titlebar}<div class="app-head">${brand()}<span class="spacer"></span>${gameChip()}<button class="icon-btn" title="Configurações">${ICON.gear}</button></div>
    <div class="app-body">${S.upd !== 'ok' ? updCard(false) : ''}${secWorld()}${secMods()}</div>${updLine}`;
}

function layoutTabs() {
  const t = (id, label, extra = '') => `<button class="tab" data-tab="${id}" aria-selected="${S.tab === id}">${label}${extra}</button>`;
  const body = S.tab === 'world' ? secWorld() + presence() : S.tab === 'mods' ? secMods() : updFull();
  return `${titlebar}<div class="app-head" style="border-bottom:0;padding-bottom:6px">${brand()}<span class="spacer"></span>${gameChip()}</div>
    <div class="tabs">${t('world', 'Mundo', worldBadge())}${t('mods', 'Mods')}${t('update', 'Atualização', updBadge())}</div>
    <div class="app-body">${body}</div>`;
}

function firstRun() {
  const stepIdx = { choose: 0, slot: 1, code: 2, paste: 1 }[S.step];
  const steps = `<div class="steps">${[0, 1, 2].map(i => `<i class="${i <= stepIdx ? 'on' : ''}"></i>`).join('')}</div>`;
  let inner = '';
  if (S.step === 'choose') inner = `${steps}<h2>Jogar junto com alguém</h2>
    <p class="lead">Quem abrir o jogo primeiro hospeda. Quando fecha, o mundo sobe e fica pronto no PC do outro.</p>
    <div class="pick">
      <button class="opt-card">${ICON.plus}<span class="t">Compartilhar um mundo meu</span><span class="s">Você escolhe o mundo e manda um código para o amigo</span></button>
      <button class="opt-card">${ICON.link}<span class="t">Tenho um código</span><span class="s">Um amigo já compartilhou o mundo dele com você</span></button>
    </div>`;
  if (S.step === 'slot') inner = `${steps}<h2>Qual mundo?</h2><p class="lead">Mundos deste PC, achados na pasta de saves do Steam.</p>
    <div class="card slots">
      <div class="row"><span class="radio on"></span><div class="txt"><div class="name">Mundo 1 <span style="color:var(--muted);font-weight:400">· world0.ksd</span></div><div class="sub">1,8 MB · jogado em 17 out, 00:16</div></div></div>
      <div class="row"><span class="radio"></span><div class="txt"><div class="name">Mundo 2 <span style="color:var(--muted);font-weight:400">· world1.ksd</span></div><div class="sub">145 KB · jogado em 20 out, 22:40</div></div></div>
    </div>
    <div class="field" style="height:40px"><input id="wname" value="${WORLD.name}" aria-label="Nome do mundo" style="font:500 14px/1 var(--font);letter-spacing:0"></div>
    <div class="fr-actions"><button class="btn">Voltar</button><button class="btn primary">Compartilhar</button></div>`;
  if (S.step === 'code') inner = `${steps}<h2>Mande este código para seu amigo</h2><p class="lead">Ele cola no app dele e o ${WORLD.name} aparece lá. Vale por 24 horas e para uma pessoa.</p>
    <div class="card code"><span class="val">ENSH-7KQ2</span><button class="btn">${ICON.copy}Copiar</button></div>
    <div class="card"><div class="row"><span class="avatar friend">?</span><div class="txt"><div class="name">Esperando o amigo</div><div class="sub">Aparece aqui quando ele usar o código</div></div>${st('busy', 'aguardando')}</div></div>
    <div class="fr-actions"><button class="btn primary">Pronto</button></div>`;
  if (S.step === 'paste') inner = `${steps}<h2>Cole o código</h2><p class="lead">O mundo é baixado para um espaço livre de save neste PC. Nenhum mundo seu é tocado.</p>
    <div class="field">${ICON.link.replace('<svg', '<svg style="width:16px;color:var(--muted)"')}<input id="code" value="ENSH-7KQ2" aria-label="Código"></div>
    <div class="card"><div class="row"><span class="avatar friend">${FRI}</span><div class="txt"><div class="name">${WORLD.name}</div><div class="sub">de ${FR} · 1,8 MB · vai para o espaço world2.ksd</div></div>${st('ok', 'código válido')}</div></div>
    <div class="fr-actions"><button class="btn">Voltar</button><button class="btn primary">${ICON.download}Baixar e entrar</button></div>`;
  return `<div class="fr embedded">${inner}</div>`;
}

/* ---------- render ---------- */
function renderSwitches() {
  document.getElementById('switches').innerHTML = SWITCHES.map(sw => `<div class="sw" ${sw.when && !sw.when(S) ? 'hidden' : ''}>
    <span class="sw-label">${sw.label}</span>
    <div class="seg">${sw.opts.map(([v, l]) => `<button data-k="${sw.key}" data-v="${v}" aria-pressed="${S[sw.key] === v}">${l}</button>`).join('')}</div></div>`).join('');
}
function render() {
  ME = S.nick === 'nfkc' ? ME_RAW.normalize('NFKC') : ME_RAW;
  renderSwitches();
  document.getElementById('win').className = 'win' + (S.skin === 'st' ? ' skin-st' + (S.title === 'serif' ? ' serif' : '') + (S.amb === 'amb' ? ' ambient' : '') : '');
  document.querySelector('.page').classList.toggle('skin-st-page', S.skin === 'st');
  const win = document.getElementById('win');
  win.innerHTML = ({ single: layoutSingle, tabs: layoutTabs, side: layoutSide })[S.layout]();
  save();
}
document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.k) { S[b.dataset.k] = b.dataset.v; render(); return; }
  if (b.dataset.tab) { S.tab = b.dataset.tab; render(); return; }
  if (b.dataset.mod) { openMod = openMod === b.dataset.mod ? null : b.dataset.mod; render(); return; }
  if (b.classList.contains('tg')) { const on = b.getAttribute('aria-checked') !== 'true'; b.setAttribute('aria-checked', on); const l = b.querySelector('.lbl'); if (l) l.textContent = on ? 'ON' : 'OFF'; }
});
render();
</script>
